# RINOMINA QUESTO FILE conf.properties e inserisci le tue credenziali reali

# Telegram Bot Configuration
telegram.bot.username=IL_TUO_BOT_USERNAME
telegram.bot.token=IL_TUO_TELEGRAM_BOT_TOKEN

# AviationStack API (500 richieste/mese)
# https://aviationstack.com/
aviationstack.api.key=LA_TUA_AVIATIONSTACK_API_KEY

# OpenSky Network API (No key)
# https://openskynetwork.github.io/opensky-api/
opensky.username=
opensky.password=

# AeroDataBox API (150 richieste/giorno)
# https://rapidapi.com/aerodatabox/api/aerodatabox
aerodatabox.api.key=LA_TUA_AERODATABOX_API_KEY

# OpenWeatherMap API (1000 richieste/giorno)
# https://openweathermap.org/api
openweather.api.key=LA_TUA_OPENWEATHER_API_KEY

# Amadeus API
# https://developers.amadeus.com/
amadeus.api.key=LA_TUA_AMADEUS_API_KEY
amadeus.api.secret=IL_TUO_AMADEUS_API_SECRET

# Database Configuration
database.url=jdbc:sqlite:./data/flyadvisor.db
database.username=IL_TUO_DATABASE_USERNAME
database.password=LA_TUA_DATABASE_PASSWORD